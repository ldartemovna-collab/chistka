name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Chistka.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Chistka-apk
          path: Chistka.apk
      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Чистка — последняя версия
          body: Скачайте Chistka.apk и установите на телефон.
          make_latest: true
          files: Chistka.apk
